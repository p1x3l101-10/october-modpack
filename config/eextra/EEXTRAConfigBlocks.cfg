# A box of explosives settings.
##########################################################################################################

"a box of explosives" {
    # Loot Table A box of explosives  Ex. "100,100;minecraft:iron_ingot;0;6;2,.."
    #  "100" - Max Random (can be any value)
    #  "100;minecraft:iron_ingot;0;6;2" --
    #   "100" - is the chance to drop(0-100%),
    #   "minecraft:iron_ingot" - is the item,
    #   "0" - is the meta of items,
    #   "6" - is the max number of items,
    #   "2" - is the min number of items.
    #  ".." - repeat the previous step if necessary(100;minecraft:iron_ingot;0;6;2).
    #  [default: [30,100;minecraft:tnt;0;12;4,88;techguns:itemshared;75;8;2], [11,100;techguns:itemshared;5;24;8], [10,100;techguns:itemshared;7;16;4], [15,100;techguns:explosive_charge;0;5;2], [10,100;techguns:explosive_charge;1;4;2], [16,100;techguns:grenadelauncher;0;1;1,100;techguns:itemshared;5;6;3,50;techguns:itemshared;5;6;3], [5,100;techguns:rocketlauncher;0;1;1,100;techguns:itemshared;7;5;2], [2,100;techguns:grimreaper;0;1;1,100;techguns:itemshared;7;9;3], [1,100;techguns:tfg;0;1;1,100;techguns:itemshared;31;2;1]]
    S:lootTableExplosivesBox <
        30,100;minecraft:tnt;0;12;4,88;techguns:itemshared;75;8;2
        11,100;techguns:itemshared;5;24;8
        10,100;techguns:itemshared;7;16;4
        15,100;techguns:explosive_charge;0;5;2
        10,100;techguns:explosive_charge;1;4;2
        16,100;techguns:grenadelauncher;0;1;1,100;techguns:itemshared;5;6;3,50;techguns:itemshared;5;6;3
        5,100;techguns:rocketlauncher;0;1;1,100;techguns:itemshared;7;5;2
        2,100;techguns:grimreaper;0;1;1,100;techguns:itemshared;7;9;3
        1,100;techguns:tfg;0;1;1,100;techguns:itemshared;31;2;1
