"concrete mixer" {
    # Ex. "30;50" Where:
    # 30 - Mixer Full
    # 50 - Mixer Empty
    # Else Air. [default: 30;50]
    S:chSpMixer=30;50

    # Loot Table Concrete Mixer  Ex. "100,100;minecraft:iron_ingot;0;6;2,.."
    #  "100" - Max Random (can be any value)
    #  "100;minecraft:iron_ingot;0;6;2" --
    #   "100" - is the chance to drop(0-100%),
    #   "minecraft:iron_ingot" - is the item,
    #   "0" - is the meta of items,
    #   "6" - is the max number of items,
    #   "2" - is the min number of items.
    #  ".." - repeat the previous step if necessary(100;minecraft:iron_ingot;0;6;2).
    #  [default: [40,100;minecraft:sand;0;24;6,20;minecraft:gravel;0;8;2], [40,100;minecraft:gravel;0;24;8,20;minecraft:sand;0;8;2], [15,100;minecraft:concrete_powder;7;18;6,20;minecraft:gravel;0;8;2,20;minecraft:sand;0;8;2], [5,100;minecraft:concrete;7;18;6,20;minecraft:concrete_powder;7;12;4]]
    S:lootTableConcreteMixer <
        40,100;minecraft:sand;0;24;6,20;minecraft:gravel;0;8;2
        40,100;minecraft:gravel;0;24;8,20;minecraft:sand;0;8;2
