##########################################################################################################
# cocoon
#--------------------------------------------------------------------------------------------------------#
# Chance spawn primitive or adaptive Arachnida, Longarms, Yelloweye.
##########################################################################################################

cocoon {
    # Ex. "30;30;30" Where:
    # 30 - Arachnida
    # 30 - Longarms
    # 30 - Yelloweye
    # Else Air. [default: 30;30;30]
    S:chSpCocoon=30;30;30

    # A chance to create an adaptive version of the monster. (random.nextInt(100)<chSpCocoonAdaMonster) [range: 0 ~ 100, default: 20]
    I:chSpCocoonAdaMonster=20

    # Loot Table Cocoon [default: [5,100;minecraft:golden_apple;0;1;1]]
    S:lootTableCocoonArachnida <
        5,100;minecraft:golden_apple;0;1;1
     >

    # Loot Table Cocoon [default: [5,100;minecraft:golden_apple;0;1;1]]
    S:lootTableCocoonLongarms <
        5,100;minecraft:golden_apple;0;1;1
     >

    # Loot Table Cocoon [default: [5,100;minecraft:golden_apple;0;1;1]]
    S:lootTableCocoonYellowEye <
        5,100;minecraft:golden_apple;0;1;1
     >

    # Maximum number of columns in the information  Cocoon [range: 0 ~ 99, default: 25]
    I:maxColumnCocoonArachnida=25

    # Maximum number of columns in the information  Cocoon [range: 0 ~ 99, default: 25]
    I:maxColumnCocoonLongarms=25

    # Maximum number of columns in the information  Cocoon [range: 0 ~ 99, default: 25]
    I:maxColumnCocoonYellowEye=25

    # Max random number Ex. If the maximum random variable is 1000 and the chance is 100, the final probability is 10%. [range: 0 ~ 999999, default: 100]
    I:maxRandomCocoonArachnida=100

    # Max random number Ex. If the maximum random variable is 1000 and the chance is 100, the final probability is 10%. [range: 0 ~ 999999, default: 100]
    I:maxRandomCocoonLongarms=100

    # Max random number Ex. If the maximum random variable is 1000 and the chance is 100, the final probability is 10%. [range: 0 ~ 999999, default: 100]
    I:maxRandomCocoonYellowEye=100

    # Add loot information? [default: true]
    B:viewInfoCocoonArachnida=true

    # Add loot information? [default: true]
    B:viewInfoCocoonLongarms=true

    # Add loot information? [default: true]
    B:viewInfoCocoonYellowEye=true

    # Rare table, Ex. "3.1,5.1,10.1,50.1,100,55" Where: 
    #  "3.1" is the max Red rare,
    #  "5.1" is the max Purple rare,
    #  "10.1" is the max Yellow rare,
    #  "50.1" is the max Blue rare,
    #  "100" is the max Green rare,
    #  "55" is the +- length column   
    #  [default: 2,6,11,21,100,50]
    S:viewInfoRareCocoonArachnida=2,6,11,21,100,50

    # Rare table, Ex. "3.1,5.1,10.1,50.1,100,55" Where: 
    #  "3.1" is the max Red rare,
    #  "5.1" is the max Purple rare,
    #  "10.1" is the max Yellow rare,
    #  "50.1" is the max Blue rare,
    #  "100" is the max Green rare,
    #  "55" is the +- length column   
    #  [default: 2,6,11,21,100,50]
    S:viewInfoRareCocoonLongarms=2,6,11,21,100,50

    # Rare table, Ex. "3.1,5.1,10.1,50.1,100,55" Where: 
    #  "3.1" is the max Red rare,
    #  "5.1" is the max Purple rare,
