"+main" {
}


##########################################################################################################
# halloween
#--------------------------------------------------------------------------------------------------------#
# Halloween Settings
##########################################################################################################

halloween {
    # Day on which Halloween parasites start spawning. [range: -1 ~ 9999999, default: 6]
    I:_dayStartEvent=6

    # Spawn settings: phase>chance;min;max [default: [4>2;1;2], [5>2;1;2], [6>3;1;3]]
    S:bolster_ghost <
        4>2;1;2
        5>2;1;2
        6>3;1;3
     >

    # Spawn settings: phase>chance;min;max [default: [4>1;1;1], [5>1;1;1], [6>2;1;1], [7>2;1;1], [8>3;1;1], [9>3;1;1], [10>5;1;2]]
    S:distributor <
        4>1;1;1
        5>1;1;1
        6>2;1;1
        7>2;1;1
        8>3;1;1
        9>3;1;1
        10>5;1;2
     >

    # Spawn settings: phase>chance;min;max [default: [2>2;3;5], [3>3;4;6], [4>3;4;6], [5>5;4;7]]
    S:rupter_butcher <
        2>2;3;5
        3>3;4;6
        4>3;4;6
        5>5;4;7
     >

    # Spawn settings: phase>chance;min;max [default: [2>1;1;2], [3>2;1;3], [4>2;1;3], [5>3;1;4]]
    S:rupter_pirate <
        2>1;1;2
        3>2;1;3
        4>2;1;3
        5>3;1;4
     >

    # Spawn settings: phase>chance;min;max [default: [2>1;1;3], [3>1;2;4], [4>1;2;5], [5>2;3;6]]
    S:rupter_rider <
        2>1;1;3
        3>1;2;4
        4>1;2;5
        5>2;3;6
     >

    # Spawn settings: phase>chance;min;max [default: [2>2;1;3], [3>3;2;4], [4>3;2;5], [5>5;3;6]]
    S:rupter_space <
        2>2;1;3
        3>3;2;4
        4>3;2;5
        5>5;3;6
     >
}


